[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel",
    "aiohttp>=3.9.3",
    "awsiotsdk>=1.21.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "hatch_rest_api"
version = "1.35.0"
authors = [
  { name="Brendan Dahl", email="dahl.brendan@gmail.com" },
]
description = "Hatch Rest mini Api Wrapper"
readme = "README.md"
requires-python = ">=3.12.0, <4"
dependencies = [
    "aiohttp>=3.8.1",
    "awsiotsdk>=1.16.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
]
keywords = [
    "hatch",
    "rest-mini",
    "api"
]

[project.urls]
"Homepage" = "https://github.com/dahlb/hatch_rest_api"
"Bug Tracker" = "https://github.com/dahlb/hatch_rest_api/issues"

[dependency-groups]
lint = [
    "prek",
    "ruff",
]
pytest = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "pytest" },
]

# The ruff configuration is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
[tool.ruff]
target-version = "py312"
exclude = [
    "stub.py",
]

[tool.ruff.lint]
select = [
    "B007",    # Loop control variable {name} not used within loop body
    "B014",    # Exception handler with duplicate exception
    "C",       # complexity
    "E",       # pycodestyle
    "F",       # pyflakes/autoflake
    "ICN001",  # import conventions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105",  # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117",  # Merge with-statements that use the same scope
    "SIM118",  # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201",  # Use {left} != {right} instead of not {left} == {right}
    "SIM212",  # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300",  # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401",  # Use get from dict with default instead of an if block
    "T20",     # flake8-print
    "TRY004",  # Prefer TypeError exception for invalid type
    "RUF006",  # Store a reference to the return value of asyncio.create_task
    "UP",      # pyupgrade
    "W",       # pycodestyle
]
ignore = [
    "D",     # docstrings
    "E501",  # line too long
    "E731",  # do not assign a lambda expression, use a def
    "F401",  # unused-import
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.codespell]
ignore-words-list = "hass,ba,fo"

[tool.pytest.ini_options]
addopts = """
  --quiet
  --timeout=20
  --durations=10
  -o console_output_style=progress
  --cov=hatch_rest_api
  --cov-report=term-missing
  --cov-report=html
"""
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["hatch_rest_api"]
relative_files = true
parallel = false

[tool.coverage.report]
show_missing = true
