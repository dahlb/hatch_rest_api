name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gets semantic release info
        id: semantic_release_info
        uses: jossef/action-semantic-release-info@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Version and Commit
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        run: |
          echo "Version: ${{steps.semantic_release_info.outputs.version}}"
          sed -i "s/^VERSION: str = \".*\"/VERSION: str = \"${{steps.semantic_release_info.outputs.version}}\"/g" src/hatch_rest_api/const.py
          if ! grep -Fq "VERSION: str = \"${{steps.semantic_release_info.outputs.version}}\"" src/hatch_rest_api/const.py; then
            echo "Expected src/hatch_rest_api/const.py to contain the new VERSION after version update" >&2
            exit 1
          fi
          git config --local user.email "dahl.brendan@gmail.com"
          git config --local user.name "Brendan Dahl"
          git add src/hatch_rest_api/const.py
          git commit -m "chore: bumping version to ${{steps.semantic_release_info.outputs.version}}"
          git tag ${{ steps.semantic_release_info.outputs.git_tag }}

      - name: Push changes
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
          branch: ${{ github.ref }}

      - name: Create GitHub Release
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semantic_release_info.outputs.git_tag }}
          release_name: ${{ steps.semantic_release_info.outputs.git_tag }}
          body: ${{ steps.semantic_release_info.outputs.notes }}
          draft: false
          prerelease: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          --user

      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          build
          --sdist
          --wheel
          --outdir dist/
          .

      - name: Publish distribution 📦 to PyPI
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: pypa/gh-action-pypi-publish@master
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
