name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linters:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run prek
        uses: j178/prek-action@v3.1.1

  typing:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.14 (with caching)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install lint requirements
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .

      - name: Run mypy
        # Checks src/hatch_rest_api with strict = true from pyproject.toml.
        run: mypy
